<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKIGAI | Meal Prep Gourmet</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #070809;
      --surface-card: #0f1215;
      --surface-elevated: #151a1f;
      --accent-gold: #c5a059;
      --accent-gold-hover: #b08d46;
      --text-primary: #f5f5f7;
      --text-muted: #8a9199;
      --border-subtle: #1b2026;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 5rem;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      padding: 0 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 8, 9, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
    }

    .brand-logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .header-actions {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .btn-cart-toggle {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--accent-gold);
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s;
    }
    .btn-cart-toggle:hover {
      border-color: var(--accent-gold);
      background: var(--surface-elevated);
    }
    .cart-badge {
      background: var(--accent-gold);
      color: #070809;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 50%;
    }

    /* CONTENEDOR Y ENCABEZADO */
    .container {
      max-width: 1240px;
      margin: 110px auto 0;
      padding: 0 1.5rem;
    }

    .page-title {
      text-align: center;
      max-width: 750px;
      margin: 0 auto 3rem;
    }
    .page-title span {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent-gold);
      display: block;
      margin-bottom: 0.5rem;
    }
    .page-title h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4vw, 3.5rem);
      font-weight: 300;
      margin-bottom: 0.8rem;
    }
    .page-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* FILTROS POR CATEGORÍA */
    .category-filters {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3.5rem;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent-gold);
      color: var(--text-primary);
      background: rgba(197, 160, 89, 0.08);
    }

    /* GRID DEL CATÁLOGO */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .dish-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .dish-card:hover {
      transform: translateY(-4px);
      border-color: #2b333c;
    }

    .dish-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #111417;
    }

    .dish-content {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .dish-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .dish-category {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-gold);
    }
    .dish-presentation {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: #13171b;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
    }

    .dish-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
      line-height: 1.25;
    }
    .dish-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .dish-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 1.2rem;
    }
    .dish-price {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-add {
      background: var(--accent-gold);
      color: #070809;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--accent-gold-hover); }

    /* CARRITO LATERAL (DRAWER) */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: var(--surface-card);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7);
      z-index: 200;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .cart-drawer.open { right: 0; }

    .cart-header {
      padding: 1.8rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
    }
    .btn-close-cart {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .btn-close-cart:hover { color: var(--text-primary); }

    .cart-items {
      padding: 1.5rem;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-elevated);
      padding: 1rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .cart-item-info h4 {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    .cart-item-info p {
      font-size: 0.8rem;
      color: var(--accent-gold);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .btn-qty {
      background: #070809;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 26px;
      height: 26px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-item-qty {
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .cart-footer {
      padding: 1.8rem;
      border-top: 1px solid var(--border-subtle);
      background: #0a0d10;
    }
    .cart-subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .cart-subtotal span:first-child { color: var(--text-muted); font-size: 0.9rem; }
    .cart-subtotal span:last-child { font-size: 1.3rem; font-weight: 600; color: var(--text-primary); }

    .btn-checkout {
      width: 100%;
      background: var(--accent-gold);
      color: #070809;
      border: none;
      padding: 0.9rem;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-checkout:hover { background: var(--accent-gold-hover); }

    /* OVERLAY */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 150;
      display: none;
    }
    .cart-overlay.active { display: block; }

    @media (max-width: 600px) {
      header { padding: 0 1.5rem; }
      .cart-drawer { width: 100%; right: -100%; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html">
      <img src="assets/images/Logo.White.png" alt="Ikigai Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='Logo.White.png';">
    </a>
    <div class="header-actions">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em;">Volver a Inicio</a>
      <button class="btn-cart-toggle" onclick="toggleCart()">
        <span>Mi Pedido</span>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- SECCIÓN PRINCIPAL -->
  <main class="container">
    <div class="page-title">
      <span>Nutrición & Precisión</span>
      <h1>Selección Semanal Meal Prep</h1>
      <p>Platillos de alta técnica culinaria, empacados al vacío y calibrados al gramo. Entregas oficiales en el GAM los Domingos y Miércoles.</p>
    </div>

    <!-- FILTROS POR CATEGORÍA -->
    <div class="category-filters" id="categoryFilters">
      <button class="filter-btn active" onclick="filterCategory('ALL')">Todos</button>
    </div>

    <!-- CUADRÍCULA DE PLATILLOS -->
    <div class="catalog-grid" id="catalogGrid">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">
        Consultando menú en vivo desde el laboratorio...
      </div>
    </div>
  </main>

  <!-- CARRITO LATERAL (DRAWER) -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Mi Pedido</h3>
      <button class="btn-close-cart" onclick="toggleCart()">&times;</button>
    </div>

    <div class="cart-items" id="cartItemsContainer">
      <!-- Se llena dinámicamente con JS -->
    </div>

    <div class="cart-footer">
      <div class="cart-subtotal">
        <span>Subtotal</span>
        <span id="cartSubtotal">₡0</span>
      </div>
      <button class="btn-checkout" onclick="proceedToCheckout()">Continuar con mi Pedido &rarr;</button>
    </div>
  </aside>

  <script>
    // =========================================================================
    // CONFIGURACIÓN DE TU API 
    // =========================================================================
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbyJjXsJ0MbEi8xYAt29PjOc9GQr9ee5cVSTnpqBXX44AAX7gXpIL3orqjDOFOyPbyu7uQ/exec";

    let catalog = [];
    let cart = JSON.parse(localStorage.getItem('ikigai_cart') || '[]');

    async function loadCatalog() {
      try {
        const response = await fetch(SCRIPT_API_URL + (SCRIPT_API_URL.includes('?') ? '&' : '?') + 'action=getCatalog');
        const result = await response.json();
        
        if (result.status === 'success' && result.data && result.data.length > 0) {
          catalog = result.data;
        } else {
          showEmptyState("No hay platillos marcados como ACTIVO en este momento.");
          return;
        }
      } catch (err) {
        console.error("Error al conectar con la API de Google Sheets:", err);
        showEmptyState("No se pudo sincronizar el menú en vivo. Por favor verifica la URL del script.");
        return;
      }

      buildFilters();
      renderCatalog('ALL');
      updateCartUI();
    }

    function showEmptyState(message) {
      document.getElementById('catalogGrid').innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">
          <p>${message}</p>
        </div>
      `;
    }

    function buildFilters() {
      const filterContainer = document.getElementById('categoryFilters');
      const categories = ['ALL', ...new Set(catalog.map(item => item.categoria).filter(Boolean))];
      
      filterContainer.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === 'ALL' ? 'active' : ''}" onclick="filterCategory('${cat}')">
          ${cat === 'ALL' ? 'Todos' : cat}
        </button>
      `).join('');
    }

    function filterCategory(selectedCategory) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === (selectedCategory === 'ALL' ? 'Todos' : selectedCategory));
      });
      renderCatalog(selectedCategory);
    }

    function renderCatalog(filter) {
      const grid = document.getElementById('catalogGrid');
      const filtered = filter === 'ALL' ? catalog : catalog.filter(p => p.categoria === filter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">No hay platillos disponibles en esta categoría.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(dish => `
        <article class="dish-card">
          <img src="${dish.foto || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'}" alt="${dish.nombre}" class="dish-image" loading="lazy">
          <div class="dish-content">
            <div class="dish-meta">
              <span class="dish-category">${dish.categoria || 'Gourmet'}</span>
              ${dish.presentacion ? `<span class="dish-presentation">${dish.presentacion}</span>` : ''}
            </div>
            <h3 class="dish-title">${dish.nombre}</h3>
            <p class="dish-desc">${dish.descripcion || ''}</p>
            <div class="dish-footer">
              <div class="dish-price">₡${Number(dish.precio).toLocaleString('es-CR')}</div>
              <button class="btn-add" onclick="addToCart('${dish.id}')">+ Agregar</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function addToCart(dishId) {
      const product = catalog.find(p => String(p.id) === String(dishId));
      if (!product) return;

      const existing = cart.find(item => String(item.id) === String(dishId));
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: product.id,
          nombre: product.nombre,
          precio: Number(product.precio),
          qty: 1
        });
      }

      saveCart();
      updateCartUI();
      openCart();
    }

    function changeQty(dishId, delta) {
      const index = cart.findIndex(item => String(item.id) === String(dishId));
      if (index === -1) return;

      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }

      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem('ikigai_cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      const countBadge = document.getElementById('cartCount');
      const container = document.getElementById('cartItemsContainer');
      const subtotalEl = document.getElementById('cartSubtotal');

      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const subtotal = cart.reduce((acc, item) => acc + (item.precio * item.qty), 0);

      countBadge.textContent = totalItems;
      subtotalEl.textContent = `₡${subtotal.toLocaleString('es-CR')}`;

      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 3rem;">El carrito está vacío.</p>`;
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <h4>${item.nombre}</h4>
            <p>₡${(item.precio * item.qty).toLocaleString('es-CR')}</p>
          </div>
          <div class="cart-item-controls">
            <button class="btn-qty" onclick="changeQty('${item.id}', -1)">-</button>
            <span class="cart-item-qty">${item.qty}</span>
            <button class="btn-qty" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      const drawer = document.getElementById('cartDrawer');
      const overlay = document.getElementById('cartOverlay');
      const isOpen = drawer.classList.contains('open');

      drawer.classList.toggle('open', !isOpen);
      overlay.classList.toggle('active', !isOpen);
    }

    function openCart() {
      document.getElementById('cartDrawer').classList.add('open');
      document.getElementById('cartOverlay').classList.add('active');
    }

    function proceedToCheckout() {
      if (cart.length === 0) {
        alert("Agrega al menos un platillo a tu pedido antes de continuar.");
        return;
      }
      window.location.href = "checkout.html";
    }

    // Inicializar
    loadCatalog();
  </script>
</body>
</html>
